<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Astro Guruji - Astrology &amp; Horoscope</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Talk to premium Astrologers on Astro Guruji. Get online Horoscope, Tarot Reading, and Vedic Astrology predictions." />
    <meta name="theme-color" content="#FF9800" />
    <link rel="icon" type="image/png" href="/images/logo-small-non-color.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,700;1,400;1,700&family=Montserrat:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700;800&family=Instrument+Sans:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Roboto:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <style>
      @keyframes scaleIn {
        from { transform: scale(0.7); opacity: 0; }
        to   { transform: scale(1);   opacity: 1; }
      }
      .animate-scaleIn { animation: scaleIn 0.3s ease; }

      /* ── Completely hide every piece of Google Translate UI ── */
      .goog-te-banner-frame          { display: none !important; }
      .goog-te-banner-frame.skiptranslate { display: none !important; }
      .skiptranslate                 { display: none !important; }
      #goog-gt-tt                    { display: none !important; }
      .goog-tooltip                  { display: none !important; }
      .goog-tooltip:after            { display: none !important; }
      .goog-tooltip:before           { display: none !important; }
      .goog-te-ftab-float            { display: none !important; }
      .goog-te-menu-value:before     { display: none !important; }
      .goog-logo-link                { display: none !important; }
      .goog-te-gadget span           { display: none !important; }
      .goog-te-gadget                { font-size: 0 !important;  }
      #google_translate_element      { display: none !important; }

      /* Prevent Google Translate from pushing body down */
      body                           { top: 0 !important; }
      body.translated-ltr            { margin-top: 0 !important; }
      body.translated-rtl            { margin-top: 0 !important; }

      /* Hide the floating "Translated by Google" ribbon */
      iframe.goog-te-banner-frame    { display: none !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- Hidden Google Translate element (required by the widget) -->
    <div id="google_translate_element" style="display:none;"></div>

    <!-- Init Google Translate silently — autoDisplay:false prevents the bar -->
    <script>
      function googleTranslateElementInit() {
        new google.translate.TranslateElement(
          { pageLanguage: "en", autoDisplay: false },
          "google_translate_element"
        );
      }
    </script>
    <script
      src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"
      async
    ></script>

    <script type="module" src="/src/main.tsx"></script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBaJahlqsM8FAUa6zAZ2RTef67NqQtVZVY&libraries=places"></script>
  </body>
</html>
