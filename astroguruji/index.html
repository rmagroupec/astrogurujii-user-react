<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Astro Guruji - Astrology &amp; Horoscope</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Talk to premium Astrologers on Astro Guruji. Get online Horoscope, Tarot Reading, and Vedic Astrology predictions." />
    <meta name="theme-color" content="#FF9800" />
    <link rel="icon" type="image/png" href="/images/logo-small-non-color.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,700;1,400;1,700&family=Montserrat:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700;800&family=Instrument+Sans:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Roboto:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <style>
      @keyframes scaleIn {
        from { transform: scale(0.7); opacity: 0; }
        to   { transform: scale(1);   opacity: 1; }
      }
      .animate-scaleIn { animation: scaleIn 0.3s ease; }

      /* ── Hide every piece of Google Translate UI ── */
      .goog-te-banner-frame,
      .goog-te-banner-frame.skiptranslate,
      .skiptranslate,
      #goog-gt-tt,
      .goog-tooltip,
      .goog-te-ftab-float,
      .goog-logo-link,
      iframe.goog-te-banner-frame,
      #google_translate_element { display: none !important; }

      .goog-tooltip:after,
      .goog-tooltip:before      { display: none !important; }
      .goog-te-menu-value:before { display: none !important; }
      .goog-te-gadget span       { display: none !important; }
      .goog-te-gadget            { font-size: 0 !important; }

      /* Prevent Google Translate from pushing body down */
      body,
      body.translated-ltr,
      body.translated-rtl { top: 0 !important; margin-top: 0 !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- Hidden Google Translate element -->
    <div id="google_translate_element" style="display:none;"></div>

    <!-- Google Translate — silent, no banner -->
    <script>
      function googleTranslateElementInit() {
        new google.translate.TranslateElement(
          { pageLanguage: "en", autoDisplay: false },
          "google_translate_element"
        );
      }
    </script>
    <script
      src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"
      async
    ></script>

    <!-- ✅ Google Maps — loading=async fixes the performance warning -->
    <script>
      (function() {
        var script = document.createElement("script");
        script.src = "https://maps.googleapis.com/maps/api/js?key=AIzaSyBaJahlqsM8FAUa6zAZ2RTef67NqQtVZVY&libraries=places&loading=async";
        script.async = true;
        script.defer = true;
        document.head.appendChild(script);
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
